apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: petclinic-db-secret
  namespace: petclinic-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: petclinic-db-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/dev/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/dev/db-credentials
        property: password
