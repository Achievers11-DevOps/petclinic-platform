image:
  repository: 118821711881.dkr.ecr.af-south-1.amazonaws.com/petclinic-dev/customers-service
  tag: latest

service:
  port: 8081

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "docker,mysql"
  - name: CONFIG_SERVER_URL
    value: "http://config-server:8888"
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: petclinic-db-secret
        key: username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: petclinic-db-secret
        key: password
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:mysql://petclinic-dev-mysql.cp6ymios4vqr.af-south-1.rds.amazonaws.com:3306/petclinic"

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done']
