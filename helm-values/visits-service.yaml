image:
  repository: 118821711881.dkr.ecr.af-south-1.amazonaws.com/petclinic-dev/visits-service
  tag: latest

service:
  port: 8082

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "docker,mysql"
  - name: CONFIG_SERVER_URL
    value: "http://config-server:8888"
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: petclinic-db-secret
        key: username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: petclinic-db-secret
        key: password

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done']
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done']
