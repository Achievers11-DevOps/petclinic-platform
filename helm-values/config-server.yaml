image:
  repository: 118821711881.dkr.ecr.af-south-1.amazonaws.com/petclinic-dev/config-server
  tag: latest

service:
  port: 8888

probes:
  startup:
    path: /actuator/health
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readiness:
    path: /actuator/health
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    path: /actuator/health
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "docker"
